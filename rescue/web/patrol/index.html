<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<title>Patrol - Rescue Locator</title>
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<link rel="stylesheet" href="../../app/tokens.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  /* One screen for a rescuer with gloves: map on top, my sector + direction + big report buttons at the bottom.
     Colours only from app/tokens.css (docs/rescue-locator/ui-design.md): paper/light by default, ☾ = dark for night. */
  :root { --green: var(--rl-ok); --red: var(--rl-danger); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--rl-bg); color: var(--rl-ink); font: 16px/1.3 var(--rl-font); }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100dvh; overflow: hidden; }
  header { z-index: 5; background: var(--rl-panel); border-bottom: 1px solid var(--rl-line); padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top));
           display: flex; align-items: center; gap: 8px; }
  header h1 { font-size: 16px; font-weight: 700; margin: 0; color: var(--rl-ink); white-space: nowrap; }
  header select { font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 10px; border-radius: var(--rl-radius); border: 1px solid var(--rl-line-strong); background: var(--rl-card); color: var(--rl-ink); flex: 1; min-width: 0; }
  .net { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--rl-panel-2); color: var(--rl-ok); white-space: nowrap; border: 1px solid var(--rl-line); }
  .net.off { background: var(--rl-warn); color: var(--rl-warn-ink); font-weight: 700; }
  .theme { background: var(--rl-card); color: var(--rl-ink); border: 1px solid var(--rl-line-strong); min-height: 44px; min-width: 44px; padding: 0 8px; font-size: 18px; border-radius: 50%; }
  #map { min-height: 0; }
  #sheet { min-width: 0; background: var(--rl-panel-solid); border-radius: 22px 22px 0 0; margin-top: -20px; z-index: 4; position: relative;
           padding: 20px 14px max(14px, env(safe-area-inset-bottom)); display: grid; gap: 12px; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  #sheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: var(--rl-line-strong); }
  .task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
  .task-label { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--rl-mute); }
  .task-seg { font-size: 23px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; font-family: var(--rl-font-num); }
  .task-seg .id { color: var(--rl-danger); margin-right: 6px; }
  .from-op { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--rl-on-accent); background: var(--rl-accent); padding: 2px 8px; border-radius: 999px; }
  .dir { grid-row: span 2; text-align: center; min-width: 86px; }
  .dir .arrow { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 2px; background: var(--rl-card); border: 2px solid var(--rl-accent); display: grid; place-items: center; color: var(--rl-on-ok); font-size: 26px; font-weight: 800; }
  .dir .arrow svg { width: 30px; height: 30px; transition: transform .4s; fill: var(--rl-accent); }
  .dir .km { font-size: 20px; font-weight: 700; font-family: var(--rl-font-num); font-variant-numeric: tabular-nums; }
  .dir .sub2 { font-size: 12px; color: var(--rl-mute); }
  .dir.inside .arrow { background: var(--rl-ok); border-color: var(--rl-ok); }
  .dir .northup { font-size: var(--rl-fs-xs); color: var(--rl-mute); }
  .dir .compass-on { min-height: 32px; margin-top: var(--rl-sp-1); padding: var(--rl-sp-1) var(--rl-sp-2); font-size: var(--rl-fs-xs); font-weight: 700; border-radius: 999px; background: var(--rl-card); color: var(--rl-accent); border: 1px solid var(--rl-accent); }
  
  .flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .flag { padding: 5px 10px; border-radius: 999px; background: color-mix(in srgb, var(--rl-danger) 12%, transparent); color: var(--rl-danger); border: 1px solid color-mix(in srgb, var(--rl-danger) 40%, transparent); font-weight: 700; font-size: 12.5px; line-height: 1.25; max-width: 100%; overflow-wrap: anywhere; }
  .flag.warn { background: color-mix(in srgb, var(--rl-warn) 25%, transparent); color: var(--rl-warn-ink); border-color: color-mix(in srgb, var(--rl-warn) 70%, transparent); }
  details { color: var(--rl-ink-2); font-size: 14px; }
  details summary { cursor: pointer; color: var(--rl-accent); font-size: 14px; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
  .task-meta b { color: var(--rl-ink); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  button { font: inherit; border: 0; border-radius: var(--rl-radius-l); padding: 12px 10px; font-weight: 700; font-size: 18px; cursor: pointer; min-height: 68px; color: var(--rl-ink); }
  button:active { transform: scale(.98); filter: brightness(1.15); }
  .b-done { background: var(--rl-ok); color: var(--rl-on-ok); } .b-part { background: var(--rl-card); color: var(--rl-ok); border: 2px solid var(--rl-ok); }
  .b-clue { background: var(--rl-danger); color: var(--rl-on-danger); grid-column: span 2; font-size: 21px; min-height: 72px; letter-spacing: .5px; }
  .b-more { background: var(--rl-card); color: var(--rl-ink); border: 1px solid var(--rl-line); grid-column: span 2; min-height: 48px; font-size: 16px; font-weight: 700; }
  .b-wx { background: var(--rl-accent); color: var(--rl-on-accent); } .b-status { background: var(--rl-card); color: var(--rl-accent); border: 2px solid var(--rl-accent); }
  .sub { font-size: 12px; font-weight: 500; display: block; opacity: .9; margin-top: 2px; }
  textarea, input[type=text] { width: 100%; font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--rl-line-strong); background: var(--rl-card); color: var(--rl-ink); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button { flex: 1; min-height: 52px; font-size: 16px; }
  .b-send { background: var(--rl-accent); color: var(--rl-on-accent); }
  .b-ghost { background: var(--rl-panel-2); color: var(--rl-ink); border: 1px solid var(--rl-line); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: var(--rl-card); color: var(--rl-ink); border: 1px solid var(--rl-line); min-height: 48px; padding: 8px 14px; font-size: 16px; font-weight: 650; border-radius: 999px; }
  .chip.on { background: var(--rl-accent); color: var(--rl-on-accent); border-color: var(--rl-accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--rl-mute); margin: 0 0 8px; }
  .log { display: grid; gap: 8px; }
  .item { border-left: 4px solid var(--rl-line); padding: 4px 0 4px 10px; font-size: 14px; }
  .item.mine { border-color: var(--rl-ok); } .item.queued { border-color: var(--rl-warn); } .item.err { border-color: var(--rl-danger); }
  .item small { color: var(--rl-mute); display: block; }
  .hint { display: inline-block; font-size: 12px; background: var(--rl-panel-2); color: var(--rl-accent); border-radius: 6px; padding: 1px 6px; margin: 2px 4px 0 0; }
  .last { font-size: 13px; color: var(--rl-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast { position: fixed; left: 12px; right: 12px; top: calc(64px + env(safe-area-inset-top)); z-index: 10; max-width: 616px; margin: 0 auto; background: var(--rl-chrome); color: var(--rl-on-chrome); border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; display: none; box-shadow: var(--rl-shadow); }
  dialog { border: 1px solid var(--rl-line); border-radius: 18px; padding: 16px; width: min(94vw, 520px); background: var(--rl-panel-solid); color: var(--rl-ink); max-height: 86dvh; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  .muted { color: var(--rl-mute); font-size: 13px; }
  .maplibregl-ctrl-attrib { font-size: 10px; }
  #ended { position: fixed; inset: auto 12px calc(12px + env(safe-area-inset-bottom)) 12px; z-index: 20; display: grid; gap: 6px; padding: 16px;
    background: var(--rl-ok); color: var(--rl-on-ok); border-radius: var(--rl-radius-l); box-shadow: var(--rl-shadow); font-size: 16px; }
  #ended b { font-size: 22px; }
  #ended button { background: var(--rl-card); color: var(--rl-ink); min-height: 52px; }
  body.embed header h1, body.embed header select { display: none; }
  /* inside the app (role Ratownik) the shell already has the title and team picker: float the two small controls over the map */
  body.embed header { position: absolute; top: 8px; right: 54px; z-index: 6; background: none; border: 0; padding: 0; gap: 6px; }
  body.embed { grid-template-rows: minmax(0, 1fr) auto; }
  @media (min-width: 700px) { #sheet { max-width: 640px; width: 100%; margin: -18px auto 0; } }
</style>
</head>
<body>
<header>
  <h1>Patrol</h1>
  <select id="team" aria-label="Zespół"></select>
  <span class="net" id="net">łączność…</span>
  <button class="theme" id="theme" aria-label="Jasny / ciemny ekran" title="Jasny / ciemny ekran">☀</button>
</header>
<div id="map" role="img" aria-label="Mapa przydzielonego segmentu"></div>
<section id="sheet">
  <div id="task" aria-live="polite"><span class="muted">Wczytuję przydział…</span></div>
  <section class="grid" id="actions">
    <button class="b-done" data-act="done">Przeszukane<span class="sub">nic, pokrycie dobre</span></button>
    <button class="b-part" data-act="part">Częściowo<span class="sub">nic, słabe pokrycie</span></button>
    <button class="b-clue" data-act="clue">ŚLAD / ZNALEZIONO</button>
    <button class="b-more" data-act="more">Pogoda · status · meldunek <span id="qcount"></span></button>
  </section>
  <div class="last" id="last"></div>
</section>
<div id="toast" role="status"></div>

<dialog id="more"><form method="dialog">
  <h2>Meldunek</h2>
  <section class="grid">
    <button type="button" class="b-wx" data-act="wx">Pogoda</button>
    <button type="button" class="b-status" data-act="status">Status zespołu</button>
  </section>
  <textarea id="free" rows="2" placeholder="własnymi słowami, np. przeszukaliśmy żleb do progu, nic, widoczność 20 m" style="margin-top:10px"></textarea>
  <div class="row"><button type="button" class="b-send" id="sendFree">Wyślij meldunek</button></div>
  <p class="muted" style="margin:8px 0 12px">Meldunek czyta model AI na serwerze akcji (bez modelu: reguły). Bez zasięgu czeka w kolejce na telefonie.</p>
  <h2>Wysłane</h2><div class="log" id="log"></div>
  <div class="row"><button value="close" class="b-ghost">Zamknij</button></div>
</form></dialog>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script type="module">
  import * as maplibregl from "../vendor/maplibre-gl.mjs";
  import { offlineStyle, loadBasemap, regionFor, hillshadeFor } from "../basemap/basemap.js";
  maplibregl.setWorkerUrl(new URL("maplibre-gl-worker.mjs", location.href).href);   // in the SW scope, so the map works offline (sw.js)

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const qs = new URLSearchParams(location.search);
  const API = qs.get("api") || (location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8780");   // the rescue-server that serves this page
  const RUN = qs.get("run") || "../../out/run.json";
  const SCN = (RUN.match(/\/api\/run\/([\w-]+)/) || [])[1] || qs.get("sc") || undefined;   // this phone's incident (its reports go only there)
  const EMBED = qs.get("embed") === "1";
  if (EMBED) document.body.classList.add("embed");
  const tell = (type, data) => { if (EMBED && parent !== window) parent.postMessage({ source: "rescuePatrol", type, ...data }, location.origin); };
  const QKEY = "rescue-patrol-queue", LKEY = "rescue-patrol-log", TKEY = "rescue-patrol-team";
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // Paper/light by default (same as the app); ☾ switches to dark for night. Kept on this phone.
  const THEME = qs.get("theme") || store.get("rescue-patrol-theme", "light");
  if (THEME === "dark") document.documentElement.dataset.theme = "dark";
  $("theme").textContent = THEME === "dark" ? "☀" : "☾";
  $("theme").onclick = () => { store.set("rescue-patrol-theme", THEME === "dark" ? "light" : "dark"); location.reload(); };

  let run, step, team, map, queue = store.get(QKEY, []), log = store.get(LKEY, []), online = true;

  // ---------- data ----------
  // LAN server with --pin: the run (/api/run/<sc>, /story) needs X-Rescue-Pin too. The app stores it raw, this page JSON-quoted - accept both.
  const pinRaw = () => { try { return String(localStorage.getItem("rescue-pin") || "").replace(/^"(.*)"$/, "$1"); } catch { return ""; } };
  const pinH = () => pinRaw() ? { "X-Rescue-Pin": pinRaw() } : {};
  let rr = await fetch(RUN, { headers: pinH() }).catch(() => null);
  if (rr && (rr.status === 401 || rr.status === 403) && !EMBED) { const p = prompt("Podaj klucz akcji:"); if (p) { store.set("rescue-pin", p.trim()); rr = await fetch(RUN, { headers: pinH() }).catch(() => null); } }
  if (!rr || !rr.ok) { document.body.innerHTML = `<p>${rr && (rr.status === 401 || rr.status === 403) ? "Podaj klucz akcji (zapytaj kierownika akcji) i odśwież stronę." : "Brak danych akcji - sprawdź połączenie i odśwież."}</p>`; await new Promise(() => {}); }
  run = await rr.json();
  step = [...run.steps].reverse().find(s => (s.assignments || []).length) || run.steps[run.steps.length - 1];   // last step that still has a plan (the final one may be "akcja zamknięta")
  const teams = (step.resources || []).filter(r => r.type !== "drone");
  $("team").innerHTML = teams.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
  team = qs.get("team") || store.get(TKEY, null) || teams[0]?.id;
  $("team").value = team;
  $("team").onchange = e => { team = e.target.value; store.set(TKEY, team); renderTask(); };

  const segById = Object.fromEntries(step.segments.map(s => [s.id, s]));
  const atClock = at => { const d = new Date(at); return /T/.test(at) && !isNaN(d) ? d.toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" }) : at; };   // ISO from rescue-server -> 16:29
  const teamName = () => (teams.find(t => t.id === team) || {}).name || team;
  const shortTeam = () => teamName().replace(/\s*\(.*\)\s*/, "");
  // Operator override (shell drag & drop or the server): {segmentId, at, by}; newer than the plan, wins.
  let overrides = store.get("rescue-patrol-overrides", {});
  const planned = () => (step.assignments || []).find(a => a.resourceId === team);
  const assignment = () => {
    const o = overrides[team];
    if (o && segById[o.segmentId]) {
      const s = segById[o.segmentId];
      return { segmentId: s.id, segmentName: s.name, poa: s.poa, reason: `Przydział od operatora${o.by ? " (" + o.by + ")" : ""}${o.at ? ", " + atClock(o.at) : ""}`, safety: [], fromOperator: true };
    }
    const pl = planned();
    if (pl) return pl;
    // already busy on a sector ("przeszukuje S3 do 23:47" / "w drodze do S9"): that is its task, not "wait"
    const r = teams.find((t) => t.id === team), m = (r && r.reason || "").match(/(?:przeszukuje|w drodze do)\s+([A-Z]+\d+)/);
    if (m && segById[m[1]]) { const s = segById[m[1]]; return { segmentId: s.id, segmentName: s.name, poa: s.poa, reason: r.reason, safety: [] }; }
    return null;
  };
  function setOverride(t, segmentId, by, at) {
    if (!segById[segmentId]) return false;
    const cur = overrides[t];
    if (cur && cur.segmentId === segmentId) return false;
    overrides[t] = { segmentId, by: by || "", at: at || new Date().toTimeString().slice(0, 5) };
    store.set("rescue-patrol-overrides", overrides);
    if (t === team) { renderTask(); toast(`Nowe zadanie: ${segmentId} ${segById[segmentId].name}`); navigator.vibrate?.(200); }
    return true;
  }

  function renderTask() {
    const a = assignment(), r = teams.find(t => t.id === team);
    if (!a) {
      $("task").innerHTML = `<div class="task-label">Przydział</div><div class="task-seg">Czekaj na zadanie</div><div class="muted">${esc(r?.reason || "Kierownik akcji jeszcze nie przydzielił sektora.")}</div>`;
    } else {
      const flags = (a.safety || []).map(f => `<span class="flag">⚠ ${esc(f)}</span>`).join("");
      $("task").innerHTML = `<div class="task">
          <div><div class="task-label">Twój sektor</div>
            <div class="task-seg"><span class="id">${esc(a.segmentId)}</span>${esc(a.segmentName)}</div>
            ${a.fromOperator ? `<span class="from-op">Nowe od operatora${a.reason.match(/, (\d\d:\d\d)$/) ? " · " + a.reason.match(/, (\d\d:\d\d)$/)[1] : ""}</span>` : ""}</div>
          <div class="dir" id="dir"></div>
        </div>
        ${flags ? `<div class="flags">${flags}</div>` : ""}
        <details><summary>Szczegóły</summary>
          <div class="task-meta"><span>Szansa w sektorze: <b>${Math.round(a.poa * 100)}%</b></span>${a.travelMin != null ? `<span>Dojście: <b>${Math.round(a.travelMin)} min</b></span>` : ""}${a.sweepMin != null ? `<span>Przeszukanie: <b>${Math.round(a.sweepMin)} min</b></span>` : ""}</div>
          <div style="margin-top:4px">${esc(a.reason)}</div>
          ${step.weather?.survival ? `<div class="flags" style="margin-top:6px"><span class="flag warn">${esc(step.weather.survival.text)}</span></div>` : ""}</details>`;
    }
    renderDir();
    if (map && map.isStyleLoaded()) highlight();
  }

  // ---------- direction to my sector (phone GPS) ----------
  let me = null;   // [lon, lat]
  const polyOf = () => { const a = assignment(); return a && segById[a.segmentId] ? segById[a.segmentId].polygon : null; };
  const centroid = poly => [poly.reduce((t, p) => t + p[0], 0) / poly.length, poly.reduce((t, p) => t + p[1], 0) / poly.length];
  const inside = (pt, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c; } return c; };
  const distM = (a, b) => { const kx = 111320 * Math.cos((a[1] + b[1]) / 2 * Math.PI / 180); return Math.hypot((a[0] - b[0]) * kx, (a[1] - b[1]) * 111320); };
  const bearing = (a, b) => { const kx = Math.cos((a[1] + b[1]) / 2 * Math.PI / 180); return (Math.atan2((b[0] - a[0]) * kx, b[1] - a[1]) * 180 / Math.PI + 360) % 360; };
  const COMPASS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
  const PL = { N: "północ", NE: "płn.-wsch.", E: "wschód", SE: "płd.-wsch.", S: "południe", SW: "płd.-zach.", W: "zachód", NW: "płn.-zach." };
  const ARROW = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 18-7-4-7 4z"/></svg>`;

  // ---------- compass: arrow relative to where the phone faces (map stays north-up) ----------
  // heading = degrees clockwise from north, null = unknown (arrow north-up). ?heading=NN fakes it for demos.
  var heading = qs.get("heading") != null && qs.get("heading") !== "" ? ((Number(qs.get("heading")) % 360) + 360) % 360 : null;
  var dirBearing = null, shownRot = null, compassRaf = 0;
  const fakeHeading = heading != null;
  // Unwrapped rotation: always turn the short way so the CSS transition never spins 350 degrees.
  function arrowRot() {
    if (dirBearing == null) return shownRot || 0;
    const target = dirBearing - (heading ?? 0);
    if (shownRot == null) shownRot = target;
    else shownRot += ((target - shownRot) % 360 + 540) % 360 - 180;
    return shownRot;
  }
  const compassNeedsPerm = () => !fakeHeading && typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function" && store.get("rescue-patrol-compass", null) !== "denied";
  function onHeading(h) {
    if (h == null || isNaN(h)) return;
    const first = heading == null;
    heading = ((h + (screen.orientation?.angle || window.orientation || 0)) % 360 + 360) % 360;
    if (first) { renderDir(); return; }   // drop the "północ u góry" note
    if (compassRaf) return;
    compassRaf = requestAnimationFrame(() => { compassRaf = 0; const s = $("dirArrow"); if (s) s.style.transform = `rotate(${Math.round(arrowRot())}deg)`; });
  }
  function listenCompass() {
    if (fakeHeading || listenCompass.on) return; listenCompass.on = true;
    if ("ondeviceorientationabsolute" in window) addEventListener("deviceorientationabsolute", e => { if (e.alpha != null) onHeading(360 - e.alpha); });
    else addEventListener("deviceorientation", e => {
      if (e.webkitCompassHeading != null) onHeading(e.webkitCompassHeading);   // iOS: already clockwise from north
      else if (e.absolute && e.alpha != null) onHeading(360 - e.alpha);
    });
  }
  function askCompass() {
    DeviceOrientationEvent.requestPermission().then(r => {
      store.set("rescue-patrol-compass", r === "granted" ? "granted" : "denied");
      if (r === "granted") listenCompass(); else renderDir();
    }).catch(() => {});
  }
  if (!fakeHeading) {
    listenCompass();   // harmless where events need permission: they just do not fire until granted
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function" && store.get("rescue-patrol-compass", null) === "granted")   // iOS asks again per page load: re-ask silently on the first tap anywhere
      addEventListener("click", () => { if (heading == null) askCompass(); }, { once: true, capture: true });
  }
  function renderDir() {
    const el = $("dir"), poly = polyOf();
    if (!el) return;
    if (!poly) { el.innerHTML = ""; return; }
    if (!me) { el.className = "dir"; el.innerHTML = `<div class="arrow">${ARROW}</div><div class="sub2">czekam na GPS</div>`; return; }
    if (inside(me, poly)) { el.className = "dir inside"; el.innerHTML = `<div class="arrow">✓</div><div class="km">w sektorze</div>`; return; }
    const c = centroid(poly), d = distM(me, c), b = bearing(me, c), k = COMPASS[Math.round(b / 45) % 8];
    el.className = "dir";
    dirBearing = b;
    el.innerHTML = `<div class="arrow"><svg id="dirArrow" viewBox="0 0 24 24" style="transform:rotate(${Math.round(arrowRot())}deg)" aria-hidden="true"><path d="M12 2l7 18-7-4-7 4z"/></svg></div>
      <div class="km">${d < 1000 ? Math.round(d / 10) * 10 + " m" : (d / 1000).toFixed(1).replace(".", ",") + " km"}</div><div class="sub2">${PL[k]}</div>
      ${heading == null ? `<div class="northup">▲N · północ u góry</div>${compassNeedsPerm() ? `<button type="button" class="compass-on" id="compassOn">Włącz kompas</button>` : ""}` : ""}`;
    const cb = $("compassOn"); if (cb) cb.onclick = askCompass;
    if (map?.getSource("me-line")) map.getSource("me-line").setData({ type: "Feature", geometry: { type: "LineString", coordinates: [me, c] } });
  }

  // ---------- map ----------
  // Regional offline basemap from the run's bbox (Tatry, Bieszczady, Karkonosze, Śniardwy, Mamry, Morzycko, Międzyzdroje).
  const bb = run.bbox, file = regionFor(bb)?.file || "tatry.pmtiles";
  await loadBasemap(maplibregl, file, { full: true });   // whole region in memory + service worker cache: works without coverage
  const hs = await hillshadeFor(bb);
  map = new maplibregl.Map({ container: "map", style: offlineStyle({ flavor: THEME === "dark" ? "dark" : "paper", file, hillshade: hs }),
    bounds: [[bb.west, bb.south], [bb.east, bb.north]], attributionControl: { compact: true } });
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), "top-right");
  map.on("load", () => {
    const fc = { type: "FeatureCollection", features: step.segments.map(s => ({ type: "Feature", properties: { id: s.id, name: s.name, poa: s.poa },
      geometry: { type: "Polygon", coordinates: [s.polygon.concat([s.polygon[0]])] } })) };
    map.addSource("segs", { type: "geojson", data: fc });
    const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const SEL = tok("--rl-select"), ACC = tok("--rl-accent");
    map.addLayer({ id: "segs-line", type: "line", source: "segs", paint: { "line-color": tok("--rl-mute"), "line-width": 1, "line-opacity": 0.6 } });
    map.addLayer({ id: "seg-mine", type: "fill", source: "segs", filter: ["==", ["get", "id"], ""], paint: { "fill-color": SEL, "fill-opacity": 0.22 } });
    map.addLayer({ id: "seg-mine-line", type: "line", source: "segs", filter: ["==", ["get", "id"], ""], paint: { "line-color": tok("--rl-danger"), "line-width": 4 } });
    map.addLayer({ id: "segs-label", type: "symbol", source: "segs", layout: { "text-field": ["get", "id"], "text-font": ["Noto Sans Medium"], "text-size": 13 },
      paint: { "text-color": tok("--rl-ink"), "text-halo-color": tok("--rl-panel-solid"), "text-halo-width": 1.5 } });
    map.addSource("me-line", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "me-line", type: "line", source: "me-line", paint: { "line-color": ACC, "line-width": 3, "line-dasharray": [1.5, 1.5] } });
    highlight();
  });
  function highlight() {
    const a = assignment(), id = a ? a.segmentId : "";
    map.setFilter("seg-mine", ["==", ["get", "id"], id]);
    map.setFilter("seg-mine-line", ["==", ["get", "id"], id]);
    const s = segById[id];
    if (s) {
      const xs = s.polygon.map(p => p[0]), ys = s.polygon.map(p => p[1]);
      map.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], { padding: { top: 40, bottom: 60, left: 40, right: 40 }, maxZoom: 15, duration: 600 });
    }
    renderDir();
  }
  renderTask();
  if (EMBED) $("team").disabled = true;
  tell("ready", { team, step: run.steps.length - 1 });

  // ---------- reports ----------
  const hhmm = () => new Date().toTimeString().slice(0, 5);
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500); }

  // Monitoring contract (rescue/README.md "X-Rescue-Client"): random client id kept on the phone, team, source.
  // Writes need the action key (from the join link / QR, or asked once); kept on this phone.
  let clientId = store.get("rescue-client-id", null);
  if (!clientId) { clientId = "patrol-" + Math.random().toString(36).slice(2, 10); store.set("rescue-client-id", clientId); }
  const headers = () => {
    const h = { "Content-Type": "application/json", "X-Rescue-Client": clientId, "X-Rescue-Team": team || "", "X-Rescue-Source": "patrol" };
    const pin = pinRaw();
    if (pin) h["X-Rescue-Pin"] = pin;
    return h;
  };
  async function post(text, at, retried, id) {
    const r = await fetch(API + "/report", { method: "POST", headers: headers(), body: JSON.stringify({ text, at, id: id && clientId + "-" + id, sc: SCN }), signal: AbortSignal.timeout(20000) });   // id: server drops a resend of a report that timed out but arrived
    if ((r.status === 401 || r.status === 403) && !retried) {
      const pin = prompt("Klucz akcji (od kierownika akcji):");
      if (pin) { store.set("rescue-pin", pin.trim()); return post(text, at, true, id); }
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function report(text) {
    const entry = { id: Date.now() + Math.random(), text, at: hhmm(), status: "sending" };
    log.unshift(entry); renderLog();
    try {
      const res = await post(text, entry.at, false, entry.id);
      Object.assign(entry, { status: "sent", hints: res.hints || [], parsedBy: res.parsedBy, latencyMs: res.latencyMs });
      tell("report", { team, text, at: entry.at, hints: entry.hints });
      setOnline(true);
      toast(`Wysłane. Odczytane: ${(res.hints || []).map(h => h.type).join(", ") || "bez wskazówek"}`);
    } catch (e) {
      entry.status = "queued"; queue.push(entry); store.set(QKEY, queue); setOnline(false);
      tell("queued", { team, text, at: entry.at, queued: queue.length });
      toast("Brak łączności - meldunek w kolejce, wyślę automatycznie.");
    }
    store.set(LKEY, log.slice(0, 50)); renderLog();
  }
  async function flush() {
    if (!queue.length) return;
    const pending = queue.slice();
    for (const e of pending) {
      try {
        const res = await post(e.text + ` (wysłane z opóźnieniem, zdarzenie o ${e.at})`, e.at, false, e.id);
        const l = log.find(x => x.id === e.id) || e;
        Object.assign(l, { status: "sent", hints: res.hints || [], parsedBy: res.parsedBy });
        queue = queue.filter(x => x.id !== e.id);
        setOnline(true);
      } catch { setOnline(false); break; }
    }
    store.set(QKEY, queue); store.set(LKEY, log.slice(0, 50)); renderLog();
  }
  setInterval(flush, 8000);
  async function ping() { try { await fetch(API + "/health", { headers: { "X-Rescue-Client": clientId, "X-Rescue-Team": team || "", "X-Rescue-Source": "patrol" }, signal: AbortSignal.timeout(3000) }); setOnline(true); flush(); } catch { setOnline(false); } }
  setInterval(ping, 15000); ping();
  function setOnline(v) { if (v !== online) tell("online", { online: v }); online = v; $("net").textContent = v ? "łączność OK" : "BEZ ŁĄCZNOŚCI"; $("net").classList.toggle("off", !v); }

  function renderLog() {
    $("qcount").textContent = queue.length ? `· ${queue.length} w kolejce` : "";
    $("last").textContent = log[0] ? `Ostatni: ${log[0].at} ${log[0].text.replace(/^[^:]*: /, "")} · ${log[0].status === "sent" ? "wysłane ✓" : log[0].status === "queued" ? "w kolejce" : "wysyłam…"}` : "";
    $("log").innerHTML = log.slice(0, 12).map(e => `<div class="item ${e.status === "sent" ? "mine" : e.status === "queued" ? "queued" : ""}">
      ${esc(e.text)}<small>${esc(e.at)} · ${e.status === "sent" ? "wysłane" + (e.parsedBy ? " · " + esc(e.parsedBy.split(":")[0]) : "") : e.status === "queued" ? "w kolejce" : "wysyłam…"}</small>
      ${(e.hints || []).map(h => `<span class="hint">${esc(h.type)}${h.segmentId ? " " + esc(h.segmentId) : ""}${h.pod != null ? " POD " + h.pod : ""}</span>`).join("")}</div>`).join("") || `<span class="muted">Brak meldunków.</span>`;
  }
  renderLog();

  // ---------- buttons ----------
  const seg = () => { const a = assignment(); return a ? `${a.segmentId} ${a.segmentName}` : "przydzielony segment"; };
  function dialog(html, onOk) {
    $("dlgForm").innerHTML = html + `<div class="row"><button value="cancel" class="b-ghost">Anuluj</button><button value="ok" class="b-send">Wyślij</button></div>`;
    $("dlg").showModal();
    $("dlg").onclose = () => { if ($("dlg").returnValue === "ok") onOk($("dlgForm")); };
    $("dlgForm").querySelectorAll(".chips").forEach(g => g.onclick = ev => { const c = ev.target.closest(".chip"); if (!c) return; ev.preventDefault();
      g.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); g.dataset.v = c.dataset.v; });
  }
  const chips = (name, opts) => `<div class="chips" data-name="${name}">${opts.map(o => `<button type="button" class="chip" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  const val = (f, name) => f.querySelector(`.chips[data-name="${name}"]`)?.dataset.v;

  document.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-act]"); if (!b) return;
    const who = shortTeam();
    if (b.dataset.act === "more") { $("more").showModal(); return; }
    if (b.dataset.act === "wx" || b.dataset.act === "status") $("more").close();
    if (b.dataset.act === "done") report(`${who}: przeszukaliśmy ${seg()}, nic, pokrycie dobre`);
    if (b.dataset.act === "part") report(`${who}: przeszukaliśmy częściowo ${seg()}, nic, pokrycie słabe`);
    if (b.dataset.act === "clue") dialog(`<h2>Ślad w ${esc(seg())}</h2>${chips("what", ["but / odzież", "plecak", "głos / wołanie", "światło", "pies zaznaczył", "poszkodowany ZNALEZIONY"])}
        <input type="text" name="note" placeholder="opis, gdzie dokładnie" style="margin-top:10px">`, f => {
        const what = val(f, "what") || "ślad", note = f.note.value.trim();
        const pos = window.__lastPos ? ` (GPS ${window.__lastPos})` : "";
        report(`${who}: ${what} w ${seg()}${note ? ", " + note : ""}${pos}`);
      });
    if (b.dataset.act === "wx") dialog(`<h2>Pogoda w terenie</h2><p class="muted">Widoczność</p>${chips("vis", ["20 m", "50 m", "100 m", "500 m", "dobra"])}
        <p class="muted">Wiatr</p>${chips("wind", ["słaby", "5 m/s", "10 m/s", "15 m/s", "20 m/s"])}<p class="muted">Opad</p>${chips("pr", ["brak", "deszcz", "śnieg", "oblodzenie"])}`, f => {
        const parts = [val(f, "vis") && `widoczność ${val(f, "vis")}`, val(f, "wind") && `wiatr ${val(f, "wind")}`, val(f, "pr") && val(f, "pr")].filter(Boolean);
        if (parts.length) report(`${who}: pogoda w ${seg()}: ${parts.join(", ")}`);
      });
    if (b.dataset.act === "status") dialog(`<h2>Status: ${esc(who)}</h2>${chips("st", ["wolni, gotowi do kolejnego zadania", "wracamy, zmęczenie", "potrzebujemy wsparcia", "kontuzja w zespole", "schodzimy - zagrożenie lawinowe"])}`, f => {
        const st = val(f, "st"); if (st) report(`${who}: ${st}`);
      });
  });
  // Incoming from the shell (same origin only): {type: "assign", segmentId, team?, by?}
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== "assign") return;
    if (setOverride(ev.data.team || team, ev.data.segmentId, ev.data.by || "operator")) tell("assigned", { team: ev.data.team || team, segmentId: ev.data.segmentId });
  });
  // Same assignment for phones outside the shell: GET <api>/api/assignments -> {"<team>": {segmentId, by, at}}; 404 = not available yet.
  async function pollAssignments() {
    try {
      const r = await fetch(API + "/api/assignments", { headers: headers(), signal: AbortSignal.timeout(4000) });
      if (!r.ok) return;
      const all = await r.json();
      for (const [t, a] of Object.entries(all || {})) if (a && a.segmentId) setOverride(t, a.segmentId, a.by, a.at);
    } catch {}
  }
  setInterval(pollAssignments, 15000); pollAssignments();
  // Incident ended (live ZNALEZIONO, GET /api/incidents ended/found): tell the team to stop and return
  const SC = SCN || "zawrat";
  let endedShown = false;
  async function pollEnded() {
    if (endedShown) return;
    try {
      const r = await fetch(API + "/api/incidents", { headers: headers(), signal: AbortSignal.timeout(5000) });
      if (!r.ok) return;
      const x = (await r.json()).find((i) => i.sc === SC);
      if (!x || !(x.ended ?? x.found)) return;
      endedShown = true;
      const b = document.createElement("div"); b.id = "ended"; b.setAttribute("role", "alert");
      b.innerHTML = `<b>Akcja zakończona</b><span>Osoba odnaleziona. Przerwijcie przeszukiwanie i wracajcie do bazy.</span><button type="button">OK</button>`;
      b.querySelector("button").onclick = () => b.remove();
      document.body.appendChild(b);
      navigator.vibrate?.([300, 150, 300]);
      tell("ended", { team, sc: SC });
    } catch {}
  }
  setInterval(pollEnded, 20000); pollEnded();
  // Operator ACK of this team's reports (GET /api/live, "acked"): short confirmation on the phone
  let lastAck = store.get("rescue-patrol-lastack", 0), lastScen = null;
  async function pollAcks() {
    try {
      const r = await fetch(API + "/api/live?since=0" + (SCN ? "&sc=" + encodeURIComponent(SCN) : ""), { headers: headers(), signal: AbortSignal.timeout(5000) });
      if (!r.ok) return;
      const evs = (await r.json()).events || [];
      // the operator moved the incident on (POST /api/advance, kind "scenario"): new plan and map, so reload this view (not mid-typing)
      const scn = evs.filter((e) => e.kind === "scenario"), top = scn.length ? Math.max(...scn.map((e) => e.seq)) : 0;
      if (lastScen === null) lastScen = top;
      else if (top > lastScen) {
        lastScen = top; toast("Nowe zdarzenie w akcji: " + scn[scn.length - 1].title); navigator.vibrate?.(200);
        if (!$("free").value.trim()) setTimeout(() => location.reload(), 2500);
      }
      const mine = evs.filter((e) => e.kind === "report" && e.team === team && e.acked && e.seq > lastAck);
      if (!mine.length) return;
      lastAck = Math.max(...mine.map((e) => e.seq)); store.set("rescue-patrol-lastack", lastAck);
      toast(mine.length > 1 ? `Operator potwierdził ${mine.length} meldunki` : "Operator potwierdził Twój meldunek ✓");
      $("last").textContent = $("last").textContent.replace(/ · potwierdzone$/, "") + " · potwierdzone";
    } catch {}
  }
  setInterval(pollAcks, 15000); pollAcks();
  $("sendFree").onclick = () => { const t = $("free").value.trim(); if (!t) return; report(`${shortTeam()}: ${t}`); $("free").value = ""; $("more").close(); };
  navigator.geolocation?.watchPosition(p => {
    window.__lastPos = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
    me = [p.coords.longitude, p.coords.latitude]; renderDir();
  }, () => {}, { enableHighAccuracy: true });
  if (qs.get("me")) { me = qs.get("me").split(",").map(Number).reverse(); renderDir(); }   // ?me=lat,lon for demos without GPS
</script>
<script>
  // Offline after the first open (sw.js). Then hand it what this first, uncontrolled load already fetched (map tiles, run, fonts).
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).then(() => navigator.serviceWorker.ready)
    .then(r => setTimeout(() => r.active?.postMessage({ cache: [location.href, ...performance.getEntriesByType("resource").map(e => e.name)] }), 3000)).catch(() => {});
</script>
</body>
</html>
