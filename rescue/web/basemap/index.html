<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa offline</title>
<link rel="stylesheet" href="../vendor/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  body { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #info { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,.92); padding: 8px 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #info b { display: block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info"><b>Mapa bazowa offline</b><span id="net">sprawdzam sieć…</span></div>
<script type="module">
  import * as maplibregl from "../vendor/maplibre-gl.mjs";
  import { offlineStyle, loadBasemap, REGIONS } from "./basemap.js";

  const R = REGIONS[new URLSearchParams(location.search).get("region")] || REGIONS.tatry;   // ?region=bieszczady|karkonosze|sniardwy
  await loadBasemap(maplibregl, R.file);
  const map = new maplibregl.Map({ container: "map", style: offlineStyle({ file: R.file }), bounds: R.bounds });
  window.map = map;
  map.addControl(new maplibregl.NavigationControl());
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }));
  // proof for the demo: every resource this page loaded came from this host
  map.on("idle", () => {
    const ext = performance.getEntriesByType("resource").filter(r => new URL(r.name).host !== location.host);
    document.getElementById("net").textContent = ext.length ? `zewnętrzne żądania: ${ext.length}` : "0 żądań do internetu - wszystko lokalnie";
  });
</script>
</body>
</html>
