<!doctype html>
<meta charset="utf-8">
<title>Rescue Locator 3D</title>
<script>
/* The 3D view moved into the app (rescue/app/3d/, shown by /app). Old links land on /app, same scenario and step. */
(function () {
  var q = new URLSearchParams(location.search), sc = q.get('sc'), a = new URLSearchParams({ mode: 'akcja', view: '3d' });
  if (sc) a.set('sc', /^blind-01/.test(sc) ? 'blind-01-replay' : sc);
  if (q.get('step')) a.set('step', q.get('step'));
  location.replace('../../app/?' + a);
})();
</script>
