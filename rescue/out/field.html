<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meldunki terenowe</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1c1c1c; --muted:#666; --line:#ddd; --llm:#1f6f43; --llmbg:#e3f3e9; --rules:#8a5a00; --rulesbg:#fff1d6; --err:#a33; --acc:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1f1f1f; --ink:#eee; --muted:#aaa; --line:#333; --llm:#7fd6a2; --llmbg:#173325; --rules:#ffc966; --rulesbg:#3a2c0e; --err:#f88; --acc:#ff6b5e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .status { display:inline-block; padding:2px 8px; border-radius: 10px; font-size: 12px; border:1px solid var(--line); }
  textarea { width:100%; min-height: 84px; font: inherit; padding: 10px; border-radius: 8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .row { display:flex; gap:8px; align-items:center; margin: 8px 0 14px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; border:1px solid var(--line); background: var(--card); color: var(--ink); padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: wait; }
  .examples { display:flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .examples button { font-size: 13px; text-align: left; max-width: 100%; }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .text { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .badge { font-size: 12px; padding: 1px 7px; border-radius: 9px; font-weight: 600; }
  .b-llm { color: var(--llm); background: var(--llmbg); }
  .b-rules { color: var(--rules); background: var(--rulesbg); }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  code { font-size: 12px; }
  .t { font-weight: 600; }
  .err { color: var(--err); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Meldunki terenowe - Rescue Locator</h1>
  <div class="sub">Działa bez internetu: lokalny model (Ollama) na laptopie kierownika akcji, a gdy go nie ma - reguły słów kluczowych. Żadnych usług w chmurze.
    <span id="status" class="status">sprawdzam serwer...</span></div>

  <textarea id="txt" placeholder="np. Patrol 2: przeszukaliśmy żleb pod Zawratem, nic, widoczność 20 m"></textarea>
  <div class="row">
    <button id="send" class="primary">Wyślij raport</button>
    <span id="msg" class="meta"></span>
  </div>

  <div class="meta">Przykładowe meldunki (demo):</div>
  <div class="examples" id="ex"></div>

  <div id="list"></div>
</main>
<script>
const EXAMPLES = [
  "Patrol 2: przeszukaliśmy żleb pod Zawratem, nic, widoczność 20 m, zaczyna padać śnieg",
  "Pies zaznaczył przy Czarnym Stawie",
  "Znaleziono rękawiczkę na szlaku niebieskim ok. 300 m nad stawem",
  "Patrol 3: Wielki Staw i Przedni Staw przeszukane, pusto. Wiatr 12 m/s",
  "Śmigłowiec nie poleci, wiatr na grani 20 m/s, mgła",
  "Dron: przelot nad Zmarzłym Stawem, brak śladów termicznych, bateria rozładowana, wracamy",
];
// Same origin when served by `swift run rescue-field serve`; localhost:8770 when opened as a file.
const API = location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8770";
const SEG = {S1:"Dolina Roztoki (dolna)",S2:"Siklawa / Roztoka górna",S3:"Schronisko i Przedni Staw",S4:"Wielki Staw",S5:"Czarny i Zadni Staw",S6:"Szlak niebieski pod Zawratem",S7:"Żleb pod Zawratem",S8:"Zawrat - Świnica, grań",S9:"Zmarzły Staw / Kozia Dolinka",S10:"Kozi Wierch - Orla Perć",S11:"Granaty / Buczynowa Dolinka",S12:"Szpiglasowa Przełęcz",S13:"Morskie Oko",S14:"Droga do Morskiego Oka",S15:"Hala Gąsienicowa / Murowaniec",S16:"Wołoszyn",S17:"Czarny Staw Gąsienicowy",S18:"Dolina za Mnichem",S19:"Las nad Wodogrzmotami"};
const $ = id => document.getElementById(id);
let local = []; // reports parsed in the browser when the local server is down
try { local = JSON.parse(localStorage.getItem("field-local") || "[]"); } catch (e) {}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function seg(id) { return id ? `${id} ${SEG[id] || ""}` : "?"; }
function hintLine(h) {
  const who = h.resource ? ` <span class="meta">(${esc(h.resource)})</span>` : "";
  switch (h.type) {
    case "segmentSearched": return `<span class="t">Przeszukany, nic:</span> ${esc(seg(h.segmentId))}, POD ${Math.round((h.pod ?? .6) * 100)}%${who}`;
    case "clue": return `<span class="t">Ślad (${esc(h.strength || "?")}):</span> ${esc(h.description || "")} @ ${h.lat ? h.lat + ", " + h.lon : esc(seg(h.segmentId))}${who}`;
    case "weatherObs": return `<span class="t">Pogoda:</span> ${[h.visibilityM != null ? "widoczność " + h.visibilityM + " m" : "", h.windMs != null ? "wiatr " + h.windMs + " m/s" : "", h.precip && h.precip !== "none" ? "opad " + h.precip : ""].filter(Boolean).join(", ")}`;
    case "resourceStatus": return `<span class="t">Zasób:</span> ${esc(h.resource)} ${h.available ? "dostępny" : "<b>niedostępny</b>"}${h.reason ? " - " + esc(h.reason) : ""}`;
  }
  return esc(JSON.stringify(h));
}
function card(r) {
  const llm = r.parsedBy.startsWith("llm");
  const badge = llm ? `<span class="badge b-llm">LLM lokalny · ${esc(r.parsedBy.replace("llm-local:", ""))}</span>`
                    : `<span class="badge b-rules">reguły awaryjne${r.browser ? " (przeglądarka)" : ""}</span>`;
  const time = (r.t || "").slice(11, 19);
  return `<div class="card"><div class="text">${esc(r.text)}</div>
    <div class="meta">${badge} · ${r.latencyMs} ms · ${time}${r.note ? ` · <span title="${esc(r.note)}">powód: ${esc(r.note.slice(0, 70))}</span>` : ""}</div>
    ${r.hints.length ? `<ul>${r.hints.map(h => `<li>${hintLine(h)}</li>`).join("")}</ul>` : `<div class="err">Nie rozpoznano wskazówek - doprecyzuj meldunek.</div>`}</div>`;
}
let server = [];
function render() {
  const all = [...server, ...local].sort((a, b) => (b.t || "").localeCompare(a.t || ""));
  $("list").innerHTML = all.map(card).join("") || `<div class="meta">Brak meldunków.</div>`;
}
async function refresh() {
  try {
    const r = await fetch(API + "/live-events", { cache: "no-store" });
    server = await r.json();
    $("status").textContent = "serwer lokalny: OK";
  } catch (e) {
    $("status").textContent = "serwer lokalny niedostępny - parsowanie regułami w przeglądarce";
  }
  render();
}

// Minimal in-browser rules fallback (mirror of FieldReportParser.parseRules, simplified).
const ALIASES = [["zleb pod zawrat","S7"],["zleb","S7"],["zlebie","S7"],["niebiesk","S6"],["pod zawratem","S6"],["swinic","S8"],["gran","S8"],["zawrat","S8"],["czarny staw gasienicow","S17"],["czarnym stawie gasienicow","S17"],["czarny staw","S5"],["czarnym staw","S5"],["zadni staw","S5"],["wielki staw","S4"],["wielkim staw","S4"],["przedni staw","S3"],["przednim staw","S3"],["schronisk","S3"],["siklaw","S2"],["roztok","S1"],["zmarzl","S9"],["kozia dolink","S9"],["kozi wierch","S10"],["orla perc","S10"],["granat","S11"],["buczynow","S11"],["szpiglas","S12"],["morskie oko","S13"],["morskim oku","S13"],["droga do morskiego","S14"],["murowan","S15"],["hala gasienicow","S15"],["hali gasienicow","S15"],["woloszyn","S16"],["za mnichem","S18"],["wodogrzmot","S19"]];
function fold(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l"); }
function rules(text) {
  const f = fold(text); let rest = f; const segs = [];
  for (const [a, id] of ALIASES) if (rest.includes(a)) { if (!segs.includes(id)) segs.push(id); rest = rest.split(a).join(" "); }
  let who = null; const pm = f.match(/patrol\s*(?:nr\s*)?(\d+)/);
  if (pm) who = "Patrol " + pm[1]; else if (/pies|psem/.test(f)) who = "pies"; else if (f.includes("dron")) who = "dron";
  const hints = [];
  const isSearch = /\bnic\b|pusto|brak sladow|bez sladow|nie znalez|negatyw/.test(f) || (f.includes("przeszuka") && !f.includes("znalez"));
  const isClue = /znalez|zaznaczyl|slad|rekawic|plecak|czapk|telefon|krzyk|glos|swiatl|gwizd|latark/.test(f) && !/nie znalez|brak slad|bez slad/.test(f);
  const neg = /nie polec|nie leci|uziemion|niedostep|wycofan|wraca|awaria|rozladowan|bateri/.test(f), pos = /gotow|dostepn|startuje|w drodze/.test(f);
  const res = /smiglow|heli/.test(f) ? "śmigłowiec" : f.includes("dron") ? "dron" : /pies|psa/.test(f) ? "pies" : f.includes("patrol") ? (who || "patrol") : null;
  if ((neg || pos) && res) hints.push({ type: "resourceStatus", resource: res, available: !neg, reason: text });
  if (isSearch && !isClue) { const poor = /mgl|snieg|zadymk|slaba widocznosc/.test(f); for (const s of segs) hints.push({ type: "segmentSearched", segmentId: s, pod: poor ? .4 : who === "pies" ? .8 : .6, resource: who }); }
  if (isClue) hints.push({ type: "clue", segmentId: segs[0] || null, description: text, strength: /zaznaczyl|rekawic|plecak|czapk|telefon/.test(f) ? "strong" : "medium", resource: who });
  const vm = f.match(/widocznosc\w*\s*(?:do\s*|ok\.?\s*|okolo\s*)?(\d+)\s*m\b/), wm = f.match(/(\d+[.,]?\d*)\s*m\/s/);
  const precip = /snieg|zadymk|sypie/.test(f) ? "snow" : /deszcz|pada|leje/.test(f) ? "rain" : null, fog = /mgl/.test(f);
  if (vm || wm || precip || fog) hints.push({ type: "weatherObs", visibilityM: vm ? +vm[1] : fog ? 50 : null, windMs: wm ? +wm[1].replace(",", ".") : null, precip, resource: who });
  return hints;
}

async function send(text) {
  text = text.trim(); if (!text) return;
  $("send").disabled = true; $("msg").textContent = "parsuję lokalnie...";
  const t0 = performance.now();
  try {
    const r = await fetch(API + "/report", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rep = await r.json();
    $("msg").textContent = `${rep.parsedBy.startsWith("llm") ? "LLM lokalny" : "reguły awaryjne"} · ${rep.latencyMs} ms`;
    $("txt").value = "";
    await refresh();
  } catch (e) {
    const rep = { t: new Date().toISOString(), source: "field", text, parsedBy: "rules", browser: true, latencyMs: Math.round(performance.now() - t0), note: "serwer lokalny niedostępny", hints: rules(text) };
    local.push(rep);
    try { localStorage.setItem("field-local", JSON.stringify(local)); } catch (e2) {}
    $("msg").textContent = "serwer niedostępny - reguły w przeglądarce (nie trafia do live-events.json)";
    $("txt").value = "";
    render();
  } finally { $("send").disabled = false; }
}

$("ex").innerHTML = EXAMPLES.map((e, i) => `<button data-i="${i}">${esc(e)}</button>`).join("");
$("ex").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { $("txt").value = EXAMPLES[+b.dataset.i]; send(EXAMPLES[+b.dataset.i]); } });
$("send").addEventListener("click", () => send($("txt").value));
$("txt").addEventListener("keydown", ev => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) send($("txt").value); });
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
