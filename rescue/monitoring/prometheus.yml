global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Docker Desktop forwards host.docker.internal to the host's loopback, so /metrics needs no PIN.
  # If a server runs with --host 0.0.0.0 and the scrape arrives from a LAN address, add the PIN:
  #   http_headers: { X-Rescue-Pin: { values: ["4821"] } }
  - job_name: rescue-server
    static_configs:
      - targets: ["host.docker.internal:8780"]
        labels: { service: server }
  - job_name: rescue-demo        # python3 rescue/monitoring/demo.py
    static_configs:
      - targets: ["host.docker.internal:8772"]
        labels: { service: field }
