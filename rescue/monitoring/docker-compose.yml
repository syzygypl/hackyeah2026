# Rescue Locator monitoring: Prometheus + Grafana on this laptop only (ports bound to 127.0.0.1).
# cd rescue/monitoring && docker compose up -d   ->  Grafana http://127.0.0.1:3000 , Prometheus http://127.0.0.1:9090
# Scrapes rescue-field :8770, rescue-studio :8771 and monitoring/demo.py :8772 on the host via host.docker.internal.
name: rescue-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      Project: hackyeah2026
      Environment: demo
      Owner: rescue-locator
    restart: unless-stopped
  grafana:
    image: grafana/grafana-oss:12.4.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rescue-teren.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    labels:
      Project: hackyeah2026
      Environment: demo
      Owner: rescue-locator
    restart: unless-stopped
