<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* The 3D view lives inside /app (iframe, ?embed=scene). A direct visit opens the app on the same scenario and step. */
(function () {
  var q = new URLSearchParams(location.search);
  if (window.top !== window || q.has('embed')) return;
  var a = new URLSearchParams({ mode: 'akcja', view: '3d' });
  if (q.get('sc')) a.set('sc', q.get('sc'));
  if (q.get('step')) a.set('step', q.get('step'));
  location.replace('../?' + a);
})();
</script>
<title>Rescue Locator 3D</title>
<link rel="stylesheet" href="style3d.css">
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "../../web/vendor/three/three.module.min.js",
  "three/addons/": "../../web/vendor/three/addons/"
} }
</script>
<!-- the whole module graph in one round trip (without this: app3d.js, then its imports, then fov3d.js) -->
<link rel="modulepreload" href="../../web/vendor/three/three.module.min.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/controls/OrbitControls.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/renderers/CSS2DRenderer.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/lines/Line2.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/lines/LineMaterial.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/lines/LineGeometry.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/lines/LineSegments2.js">
<link rel="modulepreload" href="../../web/vendor/three/addons/lines/LineSegmentsGeometry.js">
<link rel="modulepreload" href="../scale.js">
<link rel="modulepreload" href="fx3d.js">
<link rel="modulepreload" href="timeline3d.js">
<link rel="modulepreload" href="fov3d.js">
<link rel="modulepreload" href="coverage3d.js">
<link rel="modulepreload" href="walk3d.js">
<link rel="modulepreload" href="machines3d.js">
<script>
/* The scenario's static 3D files start downloading now, in parallel with the scripts; app3d.js getJSON() takes these
   promises (window.__pre3d, by absolute URL) instead of a second request. Only the default paths for ?sc= (no overrides). */
(function () {
  var q = new URLSearchParams(location.search), sc = q.get('sc') || 'zawrat';
  if (!/^[a-z0-9-]{1,40}$/.test(sc) || /blind/.test(sc) || q.has('dem') || q.has('scenario') || q.has('terrain') || q.get('wide') === '0') return;
  var pre = window.__pre3d = {};
  ['data/' + sc + '-dem-wide.json', 'data/' + sc + '-osm3d.json', 'data/' + sc + '-traffic.json', '../../scenarios/' + sc + '.json', '../../scenarios/' + sc + '-terrain.json'].forEach(function (u) {
    var url = new URL(u, location.href).href;
    pre[url] = fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status + ' ' + u); return r.json(); });
    pre[url].catch(function () {}); // a missing optional file is handled by getJSON
  });
})();
</script>
</head>
<body data-state="loading">
<div id="scene"></div>

<section id="game" class="panel" hidden></section>
<div id="offbanner" class="panel" hidden></div>
<section id="feed" aria-live="polite"></section>

<div id="sceneLegend" class="floating" hidden></div>
<div id="hud"> <!-- hidden in /app: #sceneCtl drives these buttons -->
  <button id="btn-game" class="btn red" title="Ukryj zaginionego i sprawdź, czy silnik go znajdzie">Test na ślepo</button>
  <button id="btn-cine" class="btn red" title="Kino: automatyczny przelot przez całą akcję (Esc kończy)">Kino</button>
  <button id="btn-diff" class="btn" title="Warstwa trudności terenu z silnika zamiast prawdopodobieństwa">Trudność</button>
  <button id="btn-trees" class="btn on" title="Lasy i kosodrzewina">Las</button>
  <button id="btn-traffic" class="btn on" title="Ruch samochodów na drogach (OSM)">Ruch</button>
  <button id="btn-ortho" class="btn" hidden title="Zdjęcie satelitarne Sentinel-2 (EOX, 2016) zamiast mapy topograficznej">Zdjęcie</button>
  <button id="btn-top" class="btn" title="Przelot do najbardziej prawdopodobnego segmentu">Lider</button>
  <button id="btn-all" class="btn" title="Cały obszar">Cały obszar</button>
  <button id="btn-rot" class="btn" title="Powolny obrót kamery">Obrót</button>
  <button id="btn-walk" class="btn" title="Spacer: kliknij w teren i idź z widokiem z oczu (W/S/A/D lub strzałki, mysz rozgląda się, Shift szybciej, Esc kończy)">Spacer</button>
  <button id="btn-fog" class="btn on" title="Mgła i zmrok wg warunków z kroku">Pogoda</button>
</div>

<div id="bars" aria-hidden="true"><i></i><i></i></div>
<div id="caption" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>
<div id="loading"><div class="spinner"></div><p id="loadmsg">Wczytywanie modelu terenu (Copernicus DEM)...</p></div>

<script type="module" src="app3d.js"></script>
</body>
</html>
