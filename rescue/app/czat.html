<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rescue Locator - czat zgłoszeń</title>
<meta name="description" content="Napisz zwykłym zdaniem, co widziałeś - Rescue Locator pokaże to na mapie i przeliczy, gdzie szukać najpierw.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="chat.css">
<style>
  html,body{margin:0;height:100%;background:var(--rl-bg);color:var(--rl-ink);font:17px/1.45 var(--rl-font)}
  .cz{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
  .cz-top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--rl-panel-solid);border-bottom:1px solid var(--rl-line)}
  .cz-top .brand{font-weight:700;display:flex;align-items:center;gap:8px;color:var(--rl-ink);text-decoration:none}
  .cz-top .brand svg{width:28px;height:20px;fill:var(--rl-danger)}
  .cz-top h1{font-size:17px;margin:0;font-weight:600;color:var(--rl-ink-2)}
  .cz-top .sp{flex:1}
  .cz-top a.app{font-size:14px;color:var(--rl-accent)}
  .cz-top label{font-size:14px;display:flex;gap:6px;align-items:center}
  .cz-main{display:grid;grid-template-columns:minmax(360px,560px) 1fr;min-height:0}
  .cz-side{display:flex;flex-direction:column;min-height:0;background:var(--rl-panel-solid);border-right:1px solid var(--rl-line)}
  .cz-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px 4px}
  .cz-quick button{font:600 15px/1.2 var(--rl-font);padding:12px 6px;border-radius:var(--rl-radius);border:1px solid var(--rl-line-strong);background:var(--rl-card);color:var(--rl-ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .cz-quick button span{font-size:22px}
  .cz-quick button.hot{background:var(--rl-danger);border-color:var(--rl-danger);color:var(--rl-on-danger)}
  #czChat{flex:1;min-height:0;display:flex;flex-direction:column}
  #czChat .ch-msg{font-size:17px}
  #czChat .ch-in textarea{font-size:17px}
  #czMapBox{position:relative;min-height:0}
  #czMap{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--rl-panel-2)}
  .cz-hint{position:absolute;left:12px;bottom:12px;max-width:340px;background:var(--rl-panel);backdrop-filter:blur(var(--rl-blur));border:1px solid var(--rl-line);border-radius:var(--rl-radius);padding:8px 12px;font-size:14px;color:var(--rl-ink-2);pointer-events:none}
  @media (max-width:820px){
    .cz-main{grid-template-columns:1fr;grid-template-rows:34vh 1fr}
    #czMapBox{order:-1}
    body.cz-map-big .cz-main{grid-template-rows:55vh 1fr}
    .cz-side{border-right:0;border-top:1px solid var(--rl-line)}
    .cz-quick{grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px 2px}
    .cz-quick button{font-size:13px;padding:8px 4px}
    .cz-hint,.cz-top h1{display:none}
  }
</style>
</head>
<body>
<div class="cz">
  <header class="cz-top">
    <a class="brand" href="start.html"><svg viewBox="0 0 40 28" aria-hidden="true"><path d="M1 26 13 8l6 8 5-6 15 16z"/><circle cx="31" cy="7" r="3"/></svg>Rescue Locator</a>
    <h1>Czat zgłoszeń - Zawrat, zaginiony turysta</h1>
    <span class="sp"></span>
    <label id="czLiveBox"><input type="checkbox" id="czLive" hidden> <span id="czLiveLbl" hidden>Zgłoś do akcji na żywo</span></label>
    <a class="app" href="./?sc=zawrat&amp;role=operator&amp;chat=1">Pełna aplikacja</a>
  </header>
  <main class="cz-main">
    <section class="cz-side" aria-label="Czat">
      <div class="cz-quick">
        <button type="button" class="hot" data-quick="Widziałem kogoś"><span aria-hidden="true">👁</span>Widziałem kogoś</button>
        <button type="button" data-fill="Znalazłem "><span aria-hidden="true">🎒</span>Znalazłem coś</button>
        <button type="button" data-fill="Słyszałem wołanie "><span aria-hidden="true">📣</span>Słyszałem</button>
        <button type="button" data-fill="Mgła, widoczność "><span aria-hidden="true">☁</span>Pogoda</button>
      </div>
      <div id="czChat"></div>
    </section>
    <section id="czMapBox" aria-label="Mapa: gdzie szukać najpierw">
      <iframe id="czMap" title="Mapa poszukiwań 2D"></iframe>
      <div class="cz-hint">Mapa ciepła: im cieplej, tym bardziej prawdopodobne miejsce. Każde zgłoszenie przelicza ją od nowa.</div>
    </section>
  </main>
</div>
<script type="module">
  import { mountStandalone } from "./chat.js";
  await mountStandalone();
  const ta = () => document.querySelector("#czChat textarea");
  document.querySelectorAll("[data-fill]").forEach((b) => b.onclick = () => { ta().value = b.dataset.fill; ta().focus(); });
  const live = document.getElementById("czLive");
  if (!live.hidden) document.getElementById("czLiveLbl").hidden = false;
</script>
<script src="../web/version.js" defer></script>
</body>
</html>
